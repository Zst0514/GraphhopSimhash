<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054" />
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #101828; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #475467; }
      .box { fill: #f8fafc; stroke: #98a2b3; stroke-width: 2; rx: 12; }
      .box-blue { fill: #eff8ff; stroke: #2e90fa; stroke-width: 2; rx: 12; }
      .box-purple { fill: #f4f3ff; stroke: #7a5af8; stroke-width: 2; rx: 12; }
      .box-green { fill: #ecfdf3; stroke: #12b76a; stroke-width: 2; rx: 12; }
      .box-orange { fill: #fff6ed; stroke: #f79009; stroke-width: 2; rx: 12; }
      .box-red { fill: #fff1f3; stroke: #f04438; stroke-width: 2; rx: 12; }
      .label { font: 600 16px Arial, sans-serif; fill: #101828; }
      .small { font: 500 13px Arial, sans-serif; fill: #344054; }
      .tiny { font: 500 12px Arial, sans-serif; fill: #475467; }
      .phase { font: 700 14px Arial, sans-serif; fill: #6941c6; }
      .arrow { stroke: #344054; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7a5af8; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .line { stroke: #98a2b3; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#ffffff" />
  <text x="48" y="52" class="title">Progressive BFP PE: BFPA4 Base + Optional BFPA6 Refinement</text>
  <text x="48" y="80" class="subtitle">W stays W4. BFPA6 reuses the same W tile and only adds low-2 mantissa work for selected rows.</text>

  <!-- Inputs -->
  <rect x="52" y="128" width="235" height="88" class="box-blue" />
  <text x="72" y="158" class="label">Activation mantissa</text>
  <text x="72" y="184" class="small">high-4 slice: b5..b2</text>
  <text x="72" y="204" class="small">low-2 slice: b1..b0</text>

  <rect x="52" y="260" width="235" height="78" class="box-orange" />
  <text x="72" y="291" class="label">Row precision tag</text>
  <text x="72" y="317" class="small">BFPA4: base only</text>

  <rect x="52" y="376" width="235" height="92" class="box-green" />
  <text x="72" y="407" class="label">W4 tile buffer</text>
  <text x="72" y="433" class="small">load once into SRAM/RF</text>
  <text x="72" y="454" class="small">shared by base/refine</text>

  <rect x="52" y="512" width="235" height="72" class="box" />
  <text x="72" y="542" class="label">BFP metadata</text>
  <text x="72" y="567" class="small">rowwise exponent e</text>

  <!-- Slice selector / control -->
  <rect x="360" y="152" width="210" height="190" class="box-purple" />
  <text x="383" y="184" class="label">Mantissa slice unit</text>
  <line x1="382" y1="198" x2="548" y2="198" class="line" />
  <text x="385" y="226" class="phase">Phase 1: BFPA4 base</text>
  <text x="385" y="250" class="small">issue high-4 for all rows</text>
  <text x="385" y="286" class="phase">Phase 2: BFPA6 refine</text>
  <text x="385" y="310" class="small">issue low-2 only if tag=BFPA6</text>

  <rect x="360" y="392" width="210" height="82" class="box-green" />
  <text x="386" y="424" class="label">W4 decode</text>
  <text x="386" y="450" class="small">q_w + W scale s_w</text>

  <rect x="360" y="526" width="210" height="74" class="box" />
  <text x="386" y="558" class="label">Scale inputs</text>
  <text x="386" y="584" class="small">2^e and s_w</text>

  <!-- PE core -->
  <rect x="655" y="170" width="240" height="278" class="box-red" />
  <text x="724" y="204" class="label">Integer MAC PE</text>
  <line x1="684" y1="220" x2="866" y2="220" class="line" />
  <text x="690" y="254" class="small">mantissa_int x W4_int</text>
  <text x="690" y="284" class="small">base psum:</text>
  <text x="714" y="306" class="tiny">A_high4 @ W4</text>
  <text x="690" y="346" class="small">refine psum:</text>
  <text x="714" y="368" class="tiny">A_low2 @ W4</text>
  <text x="690" y="410" class="small">same W4 tile, same PE array</text>

  <rect x="655" y="510" width="240" height="86" class="box-orange" />
  <text x="704" y="542" class="label">Row mask / issue</text>
  <text x="682" y="568" class="small">BFPA4 rows skip refine phase</text>
  <text x="682" y="588" class="small">BFPA6 rows continue low-2</text>

  <!-- Output -->
  <rect x="982" y="160" width="235" height="118" class="box-purple" />
  <text x="1026" y="192" class="label">Accumulator</text>
  <text x="1006" y="220" class="small">psum = base</text>
  <text x="1006" y="244" class="small">+ optional refinement</text>

  <rect x="982" y="330" width="235" height="96" class="box" />
  <text x="1018" y="362" class="label">Scale / shift restore</text>
  <text x="1006" y="390" class="small">apply 2^e and W scale</text>

  <rect x="982" y="490" width="235" height="92" class="box-blue" />
  <text x="1024" y="522" class="label">Output tile</text>
  <text x="1006" y="550" class="small">BFPA4 or BFPA6 embedding path</text>

  <!-- Arrows -->
  <path d="M287 172 C315 172 330 190 360 212" class="arrow" />
  <path d="M287 299 C318 299 330 284 360 284" class="arrow" />
  <path d="M287 422 C325 422 330 432 360 432" class="arrow" />
  <path d="M287 548 C324 548 330 562 360 562" class="arrow" />

  <path d="M570 246 C604 246 620 260 655 268" class="arrow" />
  <path d="M570 432 C610 432 620 388 655 346" class="arrow" />
  <path d="M570 562 C620 562 622 534 655 528" class="arrow" />
  <path d="M775 448 L775 510" class="arrow" />

  <path d="M895 224 C928 224 948 216 982 216" class="arrow" />
  <path d="M895 354 C934 354 947 244 982 244" class="dash" />
  <path d="M1099 278 L1099 330" class="arrow" />
  <path d="M1099 426 L1099 490" class="arrow" />

  <!-- Notes -->
  <rect x="332" y="628" width="620" height="54" class="box" />
  <text x="354" y="652" class="label">Cycle intuition</text>
  <text x="504" y="652" class="small">BFPA4 = high-4 work. BFPA6 = high-4 + extra low-2 work.</text>
  <text x="354" y="674" class="small">If refine ratio is r, average mantissa work = 4 + 2r bits; W tile is not reloaded for refinement.</text>

  <text x="48" y="680" class="tiny">Figure: PE-level view of the fixed-W4 progressive BFP array. The low-2 refinement is a numerical mantissa refinement, not a learned residual.</text>
</svg>
