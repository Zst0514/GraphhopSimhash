<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, "Noto Sans CJK SC", sans-serif; fill: #102027; }
      .subtitle { font: 500 17px Arial, "Noto Sans CJK SC", sans-serif; fill: #455a64; }
      .section { font: 700 20px Arial, "Noto Sans CJK SC", sans-serif; fill: #102027; }
      .label { font: 600 16px Arial, "Noto Sans CJK SC", sans-serif; fill: #102027; }
      .small { font: 14px Arial, "Noto Sans CJK SC", sans-serif; fill: #37474f; }
      .tiny { font: 12px Arial, "Noto Sans CJK SC", sans-serif; fill: #455a64; }
      .mono { font: 14px "DejaVu Sans Mono", Consolas, monospace; fill: #263238; }
      .box { fill: #ffffff; stroke: #546e7a; stroke-width: 1.4; rx: 10; }
      .soft { fill: #f7fbff; stroke: #90a4ae; stroke-width: 1.2; rx: 8; }
      .stage { fill: #e3f2fd; stroke: #1976d2; stroke-width: 1.5; rx: 10; }
      .compute { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 10; }
      .warn { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.5; rx: 10; }
      .save { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.5; rx: 10; }
      .skip { fill: #ffebee; stroke: #c62828; stroke-width: 1.4; rx: 8; }
      .line { stroke: #263238; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #607d8b; stroke-width: 1.3; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .bit-hi { fill: #1565c0; }
      .bit-mid { fill: #2e7d32; }
      .bit-low { fill: #ef6c00; }
      .bit-skip { fill: #c62828; }
      .bit-text { font: 700 14px "DejaVu Sans Mono", Consolas, monospace; fill: white; }
      .legend { font: 13px Arial, "Noto Sans CJK SC", sans-serif; fill: #263238; }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="980" fill="#fbfcfe"/>
  <text x="50" y="52" class="title">Graph-Bit Plane-Group Activation Buffer: From Early Stop to Real Hardware Savings</text>
  <text x="50" y="82" class="subtitle">核心：低位 bit-plane 只有在不读取、不发射、不更新时，early stop 才能变成 cycles / traffic / energy 收益。</text>

  <!-- Left: byte major -->
  <rect x="45" y="120" width="390" height="270" class="box"/>
  <text x="65" y="152" class="section">1. 传统 byte-major activation</text>
  <text x="65" y="180" class="small">每个 activation 一次读完整 8 bit：</text>

  <g transform="translate(70,205)">
    <text x="0" y="0" class="mono">a0 =</text>
    <g transform="translate(56,-17)">
      <rect x="0" y="0" width="30" height="28" class="bit-hi"/><text x="9" y="19" class="bit-text">b7</text>
      <rect x="30" y="0" width="30" height="28" class="bit-hi"/><text x="39" y="19" class="bit-text">b6</text>
      <rect x="60" y="0" width="30" height="28" class="bit-mid"/><text x="69" y="19" class="bit-text">b5</text>
      <rect x="90" y="0" width="30" height="28" class="bit-mid"/><text x="99" y="19" class="bit-text">b4</text>
      <rect x="120" y="0" width="30" height="28" class="bit-low"/><text x="129" y="19" class="bit-text">b3</text>
      <rect x="150" y="0" width="30" height="28" class="bit-low"/><text x="159" y="19" class="bit-text">b2</text>
      <rect x="180" y="0" width="30" height="28" class="bit-skip"/><text x="189" y="19" class="bit-text">b1</text>
      <rect x="210" y="0" width="30" height="28" class="bit-skip"/><text x="219" y="19" class="bit-text">b0</text>
    </g>
  </g>

  <g transform="translate(70,250)">
    <text x="0" y="0" class="mono">a1 = [b7 b6 b5 b4 b3 b2 b1 b0]</text>
    <text x="0" y="30" class="mono">a2 = [b7 b6 b5 b4 b3 b2 b1 b0]</text>
    <text x="0" y="60" class="mono">a3 = [b7 b6 b5 b4 b3 b2 b1 b0]</text>
  </g>

  <rect x="65" y="330" width="340" height="42" class="warn"/>
  <text x="82" y="356" class="small">问题：即使后面只用高 5 bit，低 3 bit 也已经被读入。</text>

  <!-- Reformatter -->
  <rect x="500" y="120" width="380" height="270" class="stage"/>
  <text x="520" y="152" class="section">2. NPU 内部 reformatter</text>
  <text x="520" y="180" class="small">把当前 activation tile 组织成 plane-group buffer。</text>
  <text x="520" y="208" class="tiny">不要求整个 HBM 永久 bit-plane 存储；可以在 tile 进入 NPU 后重排。</text>

  <rect x="535" y="238" width="105" height="70" class="soft"/>
  <text x="555" y="266" class="label">Byte tile</text>
  <text x="552" y="290" class="tiny">A8 packed</text>

  <path d="M650 273 C685 230, 720 230, 755 273" class="dash"/>
  <path d="M650 273 C685 315, 720 315, 755 273" class="dash"/>
  <text x="674" y="250" class="tiny">unpack</text>
  <text x="675" y="314" class="tiny">transpose</text>

  <rect x="760" y="222" width="90" height="32" class="bit-hi"/>
  <text x="775" y="243" class="bit-text">b7 b6</text>
  <rect x="760" y="260" width="90" height="32" class="bit-mid"/>
  <text x="775" y="281" class="bit-text">b5 b4</text>
  <rect x="760" y="298" width="90" height="32" class="bit-low"/>
  <text x="775" y="319" class="bit-text">b3 b2</text>
  <rect x="760" y="336" width="90" height="32" class="bit-skip"/>
  <text x="775" y="357" class="bit-text">b1 b0</text>

  <text x="535" y="356" class="tiny">Plane-group 粒度可以是 1 bit / 2 bit / 4 bit。</text>

  <!-- Bound -->
  <rect x="945" y="120" width="500" height="270" class="box"/>
  <text x="965" y="152" class="section">3. Predictor-free runtime bound</text>
  <text x="965" y="180" class="small">Degree 只决定 min_depth / tolerance；bound 决定实际 stop depth。</text>

  <rect x="975" y="205" width="190" height="68" class="soft"/>
  <text x="995" y="231" class="label">Graph risk bucket</text>
  <text x="995" y="255" class="tiny">high / mid / low</text>

  <rect x="1215" y="205" width="195" height="68" class="soft"/>
  <text x="1235" y="231" class="label">Safety policy</text>
  <text x="1235" y="255" class="tiny">min_depth + tolerance</text>
  <path d="M1168 239 L1205 239" class="line"/>

  <rect x="1000" y="306" width="380" height="56" class="warn"/>
  <text x="1020" y="330" class="small">remaining_low_bit_bound(depth) ≤ tolerance ?</text>
  <text x="1020" y="350" class="tiny">Yes: stop and skip lower planes.  No: fetch next plane group.</text>

  <!-- arrows top row -->
  <path d="M435 255 L490 255" class="line"/>
  <path d="M880 255 L935 255" class="line"/>

  <!-- Execution row -->
  <rect x="45" y="445" width="1400" height="290" class="box"/>
  <text x="65" y="478" class="section">4. 执行流程示例：low-risk node, min_depth=4, tolerance=0.04，最终停在 P5</text>

  <g transform="translate(80,515)">
    <rect x="0" y="0" width="170" height="70" class="stage"/>
    <text x="20" y="27" class="label">Fetch group0</text>
    <text x="48" y="52" class="bit-text">b7 b6</text>
  </g>
  <path d="M255 550 L320 550" class="line"/>
  <g transform="translate(325,515)">
    <rect x="0" y="0" width="170" height="70" class="stage"/>
    <text x="20" y="27" class="label">Fetch group1</text>
    <text x="48" y="52" class="bit-text">b5 b4</text>
  </g>
  <path d="M500 550 L565 550" class="line"/>
  <g transform="translate(570,515)">
    <rect x="0" y="0" width="170" height="70" class="compute"/>
    <text x="28" y="27" class="label">PE array</text>
    <text x="17" y="52" class="tiny">MAC + psum update</text>
  </g>
  <path d="M745 550 L810 550" class="line"/>
  <g transform="translate(815,515)">
    <rect x="0" y="0" width="220" height="70" class="warn"/>
    <text x="24" y="27" class="label">Bound check</text>
    <text x="20" y="52" class="tiny">P4: 0.0588 &gt; 0.04</text>
  </g>
  <path d="M1040 550 L1105 550" class="line"/>
  <g transform="translate(1110,515)">
    <rect x="0" y="0" width="210" height="70" class="stage"/>
    <text x="23" y="27" class="label">Fetch group2</text>
    <text x="42" y="52" class="bit-text">b3 b2</text>
  </g>

  <path d="M1215 590 C1190 640, 1030 640, 1000 610" class="line"/>
  <g transform="translate(775,620)">
    <rect x="0" y="0" width="260" height="70" class="warn"/>
    <text x="26" y="27" class="label">Bound check again</text>
    <text x="22" y="52" class="tiny">P5: 0.0275 ≤ 0.04 -> STOP</text>
  </g>

  <g transform="translate(1110,640)">
    <rect x="0" y="0" width="210" height="58" class="skip"/>
    <text x="25" y="25" class="label">Skip low group</text>
    <text x="57" y="47" class="bit-text">b1 b0</text>
  </g>
  <path d="M1040 655 L1100 665" class="line"/>

  <rect x="80" y="625" width="560" height="76" class="save"/>
  <text x="100" y="650" class="label">真实收益来自同步跳过：</text>
  <text x="100" y="675" class="small">low-bit fetch / RF access / PE issue / psum update</text>

  <!-- W tile reuse row -->
  <rect x="45" y="780" width="1400" height="145" class="box"/>
  <text x="65" y="812" class="section">5. W tile 省搬运靠 risk-bucket scheduler，而不是 early stop 单独完成</text>

  <rect x="85" y="838" width="240" height="58" class="soft"/>
  <text x="105" y="863" class="label">原始顺序 batch</text>
  <text x="105" y="884" class="tiny">D8 / D6 / D5 混在一起，batch depth 被高风险节点拖深。</text>

  <path d="M335 867 L420 867" class="line"/>

  <rect x="430" y="838" width="270" height="58" class="stage"/>
  <text x="450" y="863" class="label">Risk-bucket reorder</text>
  <text x="450" y="884" class="tiny">D8 bucket, D6 bucket, D5 bucket 分开调度。</text>

  <path d="M710 867 L790 867" class="line"/>

  <rect x="800" y="838" width="260" height="58" class="compute"/>
  <text x="820" y="863" class="label">Weight-stationary tile</text>
  <text x="820" y="884" class="tiny">同一 W tile 服务更多同 depth nodes。</text>

  <path d="M1070 867 L1150 867" class="line"/>

  <rect x="1160" y="838" width="240" height="58" class="save"/>
  <text x="1180" y="863" class="label">Wloads decrease</text>
  <text x="1180" y="884" class="tiny">b32 / b64 由真实 trace replay 统计。</text>

  <!-- legend -->
  <g transform="translate(55,940)">
    <rect x="0" y="-14" width="14" height="14" class="bit-hi"/><text x="22" y="-3" class="legend">high bits</text>
    <rect x="105" y="-14" width="14" height="14" class="bit-mid"/><text x="127" y="-3" class="legend">middle bits</text>
    <rect x="225" y="-14" width="14" height="14" class="bit-low"/><text x="247" y="-3" class="legend">candidate low bits</text>
    <rect x="380" y="-14" width="14" height="14" class="bit-skip"/><text x="402" y="-3" class="legend">skipped bits</text>
    <text x="560" y="-3" class="legend">注：图中 P5 示例按 2-bit group 粒度画出，实际硬件可选择 1-bit 或 2-bit group。</text>
  </g>
</svg>
